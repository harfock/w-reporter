<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maze 3D — Wall Proof</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c1420; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; width: 100%; height: 100%; }
  .panel { position: fixed; z-index: 2; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); width: min(350px, calc(100vw - 24px)); padding: 15px; border: 1px solid #40536a; border-radius: 14px; background: rgba(9, 18, 31, .88); box-shadow: 0 12px 36px #0005; backdrop-filter: blur(8px); }
  h1 { font-size: 18px; margin: 0 0 5px; }
  p { margin: 5px 0 12px; color: #bdcce0; font-size: 13px; line-height: 1.45; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 8px 0 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #eab308; flex: 0 0 auto; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { min-height: 42px; border: 1px solid #58718d; border-radius: 9px; background: #1a2c42; color: #f2f7ff; font: inherit; font-size: 13px; padding: 8px 10px; cursor: pointer; }
  button:active { background: #294766; }
  .hint { font-size: 12px; color: #a9bad0; margin-top: 10px; }
  #error { color: #fecaca; white-space: pre-wrap; }
  @media (max-width: 480px) { .panel { padding: 12px; } h1 { font-size: 16px; } p { font-size: 12px; } button { min-height: 40px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div id="scene" aria-label="Interactive 3D wall test scene"></div>
<section class="panel">
  <h1>3D Wall Proof — Clean Restart</h1>
  <p>This is a real WebGL 3D scene. The wall is a box mesh with front, side and top faces—not a perspective drawing on a 2D canvas.</p>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Loading Three.js…</span></div>
  <div class="controls">
    <button id="reset">Reset camera</button>
    <button id="wall">Toggle wall</button>
    <button id="angle">Change camera angle</button>
    <button id="wire">Toggle wireframe</button>
  </div>
  <div class="hint">Drag to orbit · Scroll/pinch to zoom · WASD or arrow keys to move · R to reset</div>
  <div class="hint" id="error" role="status"></div>
</section>
<script type="module">
import * as THREE from 'three';

const mount = document.querySelector('#scene');
const statusEl = document.querySelector('#status');
const dot = document.querySelector('#dot');
const errorEl = document.querySelector('#error');
let renderer, scene, camera, wallMesh, wallMaterial, grid, floor, axes;
let wallVisible = true;
let wireframe = false;
let yaw = Math.PI * 0.22;
let pitch = 0.34;
let distance = 8.2;
const target = new THREE.Vector3(0, 1.0, 0);
const keys = new Set();
let dragging = false;
let lastX = 0, lastY = 0;

function setStatus(text, ok = true) {
  statusEl.textContent = text;
  dot.style.background = ok ? '#22c55e' : '#ef4444';
}
function updateCamera() {
  pitch = THREE.MathUtils.clamp(pitch, 0.08, 1.35);
  distance = THREE.MathUtils.clamp(distance, 3.0, 18.0);
  const horizontal = Math.cos(pitch) * distance;
  camera.position.set(
    target.x + Math.sin(yaw) * horizontal,
    target.y + Math.sin(pitch) * distance,
    target.z + Math.cos(yaw) * horizontal
  );
  camera.lookAt(target);
}
function resize() {
  if (!renderer || !camera) return;
  const w = Math.max(1, mount.clientWidth);
  const h = Math.max(1, mount.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
function resetCamera() {
  yaw = Math.PI * 0.22;
  pitch = 0.34;
  distance = 8.2;
  target.set(0, 1, 0);
  updateCamera();
}
function buildScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color('#a8c7dc');
  scene.fog = new THREE.Fog('#a8c7dc', 18, 42);

  camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 100);
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  mount.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight('#eaf6ff', '#536b47', 2.0));
  const sun = new THREE.DirectionalLight('#fff2d6', 3.0);
  sun.position.set(-4, 9, 6);
  scene.add(sun);

  const floorMaterial = new THREE.MeshStandardMaterial({ color: '#88a86b', roughness: 0.94 });
  floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.025;
  floor.receiveShadow = true;
  scene.add(floor);

  grid = new THREE.GridHelper(30, 30, '#506a4a', '#78926b');
  grid.position.y = 0.006;
  scene.add(grid);

  // The core proof: a genuine 3D box mesh with measurable width, height and depth.
  wallMaterial = new THREE.MeshStandardMaterial({ color: '#e6a34c', roughness: 0.76, metalness: 0.0, wireframe: false });
  wallMesh = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.2, 0.42), wallMaterial);
  wallMesh.position.set(0, 1.1, 0);
  wallMesh.castShadow = true;
  wallMesh.receiveShadow = true;
  scene.add(wallMesh);

  // Two perpendicular wall segments prove that corners are actual 3D geometry.
  const sideWall = new THREE.Mesh(new THREE.BoxGeometry(0.42, 2.2, 3.2), new THREE.MeshStandardMaterial({ color: '#d58c3b', roughness: 0.8 }));
  sideWall.position.set(-1.9, 1.1, -1.72);
  sideWall.castShadow = true;
  sideWall.receiveShadow = true;
  scene.add(sideWall);

  const farWall = new THREE.Mesh(new THREE.BoxGeometry(3.8, 1.7, 0.38), new THREE.MeshStandardMaterial({ color: '#c97c36', roughness: 0.82 }));
  farWall.position.set(0.5, 0.85, -4.0);
  farWall.castShadow = true;
  farWall.receiveShadow = true;
  scene.add(farWall);

  axes = new THREE.AxesHelper(1.4);
  axes.position.set(-3.4, 0.02, 1.5);
  scene.add(axes);

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -9;
  sun.shadow.camera.right = 9;
  sun.shadow.camera.top = 9;
  sun.shadow.camera.bottom = -9;
  sun.shadow.bias = -0.0003;

  resetCamera();
  resize();
  setStatus('3D scene created — wall mesh is present');
}

function animate() {
  requestAnimationFrame(animate);
  if (!renderer || !scene || !camera) return;
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const move = new THREE.Vector3();
  if (keys.has('w') || keys.has('arrowup')) move.add(forward);
  if (keys.has('s') || keys.has('arrowdown')) move.sub(forward);
  if (keys.has('d') || keys.has('arrowright')) move.add(right);
  if (keys.has('a') || keys.has('arrowleft')) move.sub(right);
  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(0.075);
    target.add(move);
    updateCamera();
  }
  renderer.render(scene, camera);
}

try {
  buildScene();
  animate();
} catch (error) {
  setStatus('3D initialization failed', false);
  errorEl.textContent = String(error?.stack || error);
  throw error;
}

mount.addEventListener('pointerdown', event => {
  if (event.pointerType === 'mouse' && event.button !== 0) return;
  dragging = true; lastX = event.clientX; lastY = event.clientY;
  mount.setPointerCapture?.(event.pointerId);
});
mount.addEventListener('pointermove', event => {
  if (!dragging) return;
  const dx = event.clientX - lastX;
  const dy = event.clientY - lastY;
  lastX = event.clientX; lastY = event.clientY;
  yaw -= dx * 0.006;
  pitch += dy * 0.004;
  updateCamera();
});
function stopDrag() { dragging = false; }
mount.addEventListener('pointerup', stopDrag);
mount.addEventListener('pointercancel', stopDrag);
mount.addEventListener('wheel', event => {
  event.preventDefault();
  distance *= Math.exp(event.deltaY * 0.001);
  updateCamera();
}, { passive: false });
window.addEventListener('keydown', event => {
  const key = event.key.toLowerCase();
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key)) event.preventDefault();
  keys.add(key);
  if (key === 'r') resetCamera();
});
window.addEventListener('keyup', event => keys.delete(event.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());
window.addEventListener('resize', resize);
document.querySelector('#reset').addEventListener('click', resetCamera);
document.querySelector('#wall').addEventListener('click', () => {
  wallVisible = !wallVisible;
  wallMesh.visible = wallVisible;
  setStatus(wallVisible ? 'Main 3D wall visible' : 'Main 3D wall hidden — toggle proves mesh control');
});
document.querySelector('#angle').addEventListener('click', () => {
  yaw += Math.PI / 3;
  updateCamera();
});
document.querySelector('#wire').addEventListener('click', () => {
  wireframe = !wireframe;
  wallMaterial.wireframe = wireframe;
  setStatus(wireframe ? 'Wireframe mode — wall geometry visible' : 'Solid material mode');
});
</script>
</body>
</html>
